# Web server for the frontend inside Docker (serves the HTML/JS/CSS files).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off; # don't advertise the nginx version

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8000 https://0.peerjs.com wss://0.peerjs.com; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
