# Used inside Docker (SPRING_PROFILES_ACTIVE=docker): PostgreSQL instead of H2.
# "db" is the database container's name in docker-compose.yml.
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB:silentsignal}
spring.datasource.username=${POSTGRES_USER:silentsignal}
spring.datasource.password=${POSTGRES_PASSWORD}
