# application.properties - runtime configuration for the core API.
#
# Nothing secret is hardcoded here in a way that would leak to Git: the one
# real "secret" this app has is per-contact ntfy topic names, and those live
# in the database (entered through /settings), not in this file. If you add
# any API key later, put it in a local `.env`-style override (see below) and
# make sure that file is in .gitignore - never commit real secrets.

# --- Server ---
server.port=8080

# --- Database: H2 in file mode ---
# "file mode" means the DB is a real file on disk (./data/distressdb.mv.db),
# so data survives restarts, unlike H2's in-memory mode. Zero install needed.
spring.datasource.url=jdbc:h2:file:./data/distressdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update tables automatically from our @Entity classes.
# Fine for a hackathon MVP; a real product would use versioned migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2's built-in web console, handy for poking at the DB during the demo.
# Visit http://localhost:8080/h2-console (JDBC URL must match the one above).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- ntfy.sh (free push notification relay) ---
# Base URL only - actual topics are per-contact and stored in the DB.
ntfy.base-url=https://ntfy.sh

# --- CORS: only allow the frontend's localhost origins ---
# The frontend is plain static HTML/JS served from a simple dev server.
# Adjust the port list if your frontend runs somewhere else.
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081

# --- Upload / request size hygiene (defence in depth; the FastAPI service
# is the one that actually receives audio, but we cap here too since this
# API is reachable directly from the browser for other endpoints). ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# --- Escalation timing ---
# How long an alert waits for an acknowledgement before re-notifying the
# next contact in priority order.
app.escalation.timeout-minutes=2

# Base URL this API is reachable at, used to build the "Acknowledge" link
# embedded in ntfy notifications. Change this if you tunnel the API
# somewhere other than localhost (see the Apple Shortcuts stretch goal).
app.base-url=http://localhost:8080

