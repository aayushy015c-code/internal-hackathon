server.port=8080

# Database: H2 saved to ./data/distressdb (so data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/distressdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Look at the database in the browser: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/distressdb, user: sa, no password)
spring.h2.console.enabled=true

# Push notifications go through ntfy.sh
ntfy.base-url=https://ntfy.sh

# Which websites are allowed to call this API (our frontend)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# If nobody taps "Acknowledge" within this many minutes, notify the next contact
app.escalation.timeout-minutes=2

# Used to build the "Acknowledge" link inside the notification
app.base-url=http://localhost:8080
