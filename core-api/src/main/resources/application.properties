# Only accept connections from this computer, not from the Wi-Fi network.
# (Docker sets SERVER_ADDRESS=0.0.0.0 inside the container, and publishes the
#  port only on 127.0.0.1 of your computer, so it's still local-only.)
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080

# Secrets (passwords, encryption key, ntfy token) live in core-api/.env, which is NOT on GitHub.
# Copy .env.example to .env and fill it in.
spring.config.import=optional:file:.env[.properties]

# Key used to encrypt sensitive columns (names, code words, location...) before
# they are saved. 32 random bytes, Base64. Generate one with:  openssl rand -base64 32
app.encryption-key=${DATA_ENCRYPTION_KEY}

# Database when running WITHOUT Docker: H2 saved to ./data/distressdb, and the
# whole file is also encrypted with AES. Password is "<file password> <user password>".
# (With Docker, application-docker.properties switches this to PostgreSQL.)
spring.datasource.url=jdbc:h2:file:./data/distressdb;CIPHER=AES
spring.datasource.username=sa
spring.datasource.password=${DB_FILE_PASSWORD} ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Database viewer in the browser. Off by default. Turn on only while debugging.
spring.h2.console.enabled=false

# Push notifications (ntfy.sh, or your own ntfy server)
ntfy.base-url=${NTFY_BASE_URL:https://ntfy.sh}
ntfy.token=${NTFY_TOKEN:}

# Which websites are allowed to call this API (our frontend)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# Host names that may use the full API. Anything else (e.g. a tunnel) can only open the ack link.
app.allowed-hosts=${ALLOWED_HOSTS:localhost,127.0.0.1}

# If nobody taps "Acknowledge" within this many minutes, notify the next contact
app.escalation.timeout-minutes=2

# Alerts older than this are deleted automatically
app.retention-days=30

# Used to build the "Acknowledge" link inside the notification.
# localhost only works on this laptop. For contacts' phones you need a tunnel (see TUNNEL.md):
#  - either set APP_BASE_URL to your tunnel's https URL
#  - or set TUNNEL_METRICS_URL and we ask cloudflared for its URL automatically (Docker does this)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.tunnel-metrics-url=${TUNNEL_METRICS_URL:}
