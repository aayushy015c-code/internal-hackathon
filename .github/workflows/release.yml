# CD: when you push a version tag, e.g.
#     git tag v1.0.0 && git push origin v1.0.0
# this workflow
#   1. runs the Java tests
#   2. publishes Docker images to GitHub's container registry (ghcr.io)
#   3. creates a GitHub Release with ready-to-run files
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push Docker images to ghcr.io

jobs:
  images:
    name: Publish Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-api, analysis-service, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test core API
        run: mvn -B -ntp verify
        working-directory: core-api
      - name: Package
        run: |
          mkdir -p dist
          cp core-api/target/core-api.jar dist/
          cp core-api/.env.example dist/core-api.env.example
          cp docker-compose.yml .env.example dist/
          zip -r dist/frontend.zip frontend
          zip -r dist/analysis-service.zip analysis-service -x "analysis-service/tests/*" "analysis-service/.venv/*"
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
