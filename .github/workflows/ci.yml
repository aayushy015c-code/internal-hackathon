# CI: runs on every push and pull request.
# If any job fails, GitHub shows a red X on the commit.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Core API (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and run tests
        run: mvn -B -ntp verify
        working-directory: core-api

  python:
    name: Analysis service (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: analysis-service/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
        working-directory: analysis-service
      - name: Run tests
        run: python -m pytest -q tests
        working-directory: analysis-service
      - name: Check dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt
        working-directory: analysis-service

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax
        run: for f in frontend/js/*.js frontend/service-worker.js; do node --check "$f"; done
      - name: No inline scripts or styles (they would break our Content-Security-Policy)
        run: |
          if grep -nE '<script>|onclick=|onload=|onerror=|style="' frontend/*.html; then
            echo "Move this into a .js or .css file."; exit 1
          fi
      - name: Every page has a Content-Security-Policy
        run: |
          for f in frontend/*.html; do
            grep -q 'Content-Security-Policy' "$f" || { echo "$f has no CSP"; exit 1; }
          done
      - name: CDN scripts have an integrity hash
        run: |
          if grep -n 'src="https://' frontend/*.html | grep -v integrity; then
            echo "Add integrity= and crossorigin= to this script tag."; exit 1
          fi

  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [java, python]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis-service/requirements*.txt
      - name: Build core API
        run: mvn -B -ntp -DskipTests package
        working-directory: core-api
      - name: Install analysis service (web part only, stub mode needs no audio libraries)
        run: pip install fastapi==0.141.1 "uvicorn[standard]==0.54.0" python-multipart==0.0.32 httpx==0.28.1 python-dotenv==1.2.3 numpy==2.5.3
      - name: Run smoke test
        run: bash scripts/smoke_test.sh

  docker:
    name: Docker stack (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [java, python]
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with random secrets (only for this test run)
        run: printf "POSTGRES_PASSWORD=%s\nDATA_ENCRYPTION_KEY=%s\n" "$(openssl rand -hex 24)" "$(openssl rand -base64 32)" > .env
      - name: Build and start everything (stub mode, no speech model download)
        run: STUB_MODE=true docker compose up -d --build --wait
      - name: Smoke test against the Docker stack
        run: MODE=docker bash scripts/smoke_test.sh
      - name: Scan images for known vulnerabilities (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: silent-signal-core-api:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan analysis-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: silent-signal-analysis-service:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Stop
        if: always()
        run: docker compose down -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      # third-party actions are pinned to an exact commit, so a moved tag can't change them
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
